# OpenOCD chain for configuration-space access ONLY. No targets, no DAP, no polling.
#
# `target/zynq_7000.cfg` creates two cortex_a targets on the ARM TAP, and OpenOCD polls
# them. That polling issues its own scans between an `irscan` and the `drscan` that belongs
# to it, so the PL TAP is back in BYPASS by the time the data scan runs and
# `interface_jtag_add_dr_scan` asserts `active == tap`. Declaring the chain without targets
# removes the interference — and, incidentally, means this never halts the CPU.
#
# Both TAPs are still declared, because the chain is physically two TAPs and the ARM one
# has to be padded with BYPASS; OpenOCD does that itself once it knows the IR length.

adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
# FT4232H MPSSE: AD0=TCK AD1=TDI AD2=TDO AD3=TMS, TMS idle high
ftdi layout_init 0x0008 0x000b

reset_config none
adapter speed 2000

# Declared TDO-first, the same order target/zynq_7000.cfg uses and the chain scan confirms.
jtag newtap zynq_pl bs -irlen 6 -ircapture 0x1 -irmask 0x03 -expected-id 0x13722093
jtag newtap zynq cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x4ba00477
